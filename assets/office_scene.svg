<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
<defs>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#b9d1df"/><stop offset="1" stop-color="#829eb2"/></linearGradient>
 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#52697a"/><stop offset="1" stop-color="#243746"/></linearGradient>
 <linearGradient id="desk" x2="0" y2="1"><stop stop-color="#d99a50"/><stop offset="1" stop-color="#8d4c21"/></linearGradient>
 <linearGradient id="metal" x2="1" y2="1"><stop stop-color="#d8e0e4"/><stop offset=".5" stop-color="#788994"/><stop offset="1" stop-color="#e0e7e9"/></linearGradient>
 <linearGradient id="fanblue" x2="1" y2="1"><stop stop-color="#8ceaff"/><stop offset="1" stop-color="#087aa9"/></linearGradient>
 <pattern id="tiles" width="80" height="42" patternUnits="userSpaceOnUse"><path d="M0 0H80M0 0V42" stroke="#9bb0bc" stroke-opacity=".16" fill="none"/></pattern>
 <pattern id="mesh" width="10" height="12" patternUnits="userSpaceOnUse"><path d="M0 0L10 12M10 0L0 12" stroke="#d9e3e8" stroke-opacity=".75" stroke-width="1"/></pattern>
</defs>
<!-- coherent office wall and floor -->
<rect width="800" height="425" fill="url(#wall)"/>
<path d="M0 0H800V425L0 403Z" fill="#ffffff" opacity=".05"/>
<!-- window -->
<rect x="0" y="0" width="205" height="310" fill="#dceaf0" stroke="#e5e9e9" stroke-width="12"/>
<rect x="8" y="8" width="189" height="287" fill="#8bd4f5"/>
<path d="M8 190L35 155 52 173 75 120 94 168 118 101 142 167 166 137 197 174V295H8Z" fill="#4e9ecb" opacity=".65"/>
<path d="M8 225L35 197 61 218 88 185 115 221 147 194 197 224V295H8Z" fill="#4c987c"/>
<path d="M100 8L70 8 70 295 100 295Z" fill="#e7eff3" opacity=".5"/>
<path d="M105 8V295M8 155H197" stroke="#f5f7f7" stroke-width="7"/>
<rect x="0" y="297" width="214" height="22" rx="2" fill="#e7e4dc"/><path d="M0 319L214 319" stroke="#5c6d78" stroke-width="5"/>
<!-- wall clock -->
<circle cx="435" cy="67" r="43" fill="#2c3b47"/><circle cx="435" cy="67" r="36" fill="#f2f0e8" stroke="#a7b5bd" stroke-width="4"/>
<g fill="#273744" font-family="Arial" font-size="10" text-anchor="middle"><text x="435" y="41">12</text><text x="459" y="70">3</text><text x="435" y="96">6</text><text x="410" y="70">9</text></g><path d="M435 67L419 53M435 67L452 55" stroke="#293946" stroke-width="3" stroke-linecap="round"/><circle cx="435" cy="67" r="4" fill="#293946"/>
<!-- motivational poster -->
<rect x="260" y="36" width="102" height="132" rx="3" fill="#6c4328" stroke="#4c3427" stroke-width="4"/><rect x="269" y="45" width="84" height="114" fill="#f5f0df"/><g font-family="Arial" font-weight="bold" font-size="20" fill="#27445b" text-anchor="middle"><text x="311" y="78">WORK</text><text x="311" y="103">FOCUS</text><text x="311" y="128">WIN</text></g>
<!-- whiteboard -->
<rect x="485" y="45" width="218" height="155" rx="8" fill="#52616c" opacity=".45"/><rect x="491" y="39" width="208" height="151" rx="5" fill="url(#metal)" stroke="#657580" stroke-width="3"/><rect x="501" y="49" width="188" height="126" rx="2" fill="#f6f7f5"/><path d="M501 177H689" stroke="#aeb8bd" stroke-width="5"/><rect x="600" y="180" width="32" height="6" rx="3" fill="#df4938"/><rect x="637" y="180" width="29" height="6" rx="3" fill="#276ab2"/>
<!-- filing cabinet on right -->
<rect x="700" y="230" width="100" height="265" fill="#607786"/><rect x="707" y="239" width="86" height="76" fill="#778d9b" stroke="#405361" stroke-width="3"/><rect x="707" y="321" width="86" height="76" fill="#778d9b" stroke="#405361" stroke-width="3"/><rect x="707" y="403" width="86" height="76" fill="#778d9b" stroke="#405361" stroke-width="3"/><g fill="#c8d0d4" stroke="#4c5c67" stroke-width="2"><rect x="733" y="270" width="34" height="7" rx="3"/><rect x="733" y="352" width="34" height="7" rx="3"/><rect x="733" y="434" width="34" height="7" rx="3"/></g>
<!-- wall trim -->
<path d="M0 400L800 425V444L0 419Z" fill="#667d8d"/><path d="M0 409L800 434" stroke="#d1d9dc" stroke-width="3" opacity=".7"/>
<!-- tiled floor -->
<path d="M0 419L800 444V600H0Z" fill="url(#floor)"/><path d="M0 419L800 444V600H0Z" fill="url(#tiles)"/><g stroke="#b1c1ca" stroke-opacity=".16" fill="none"><path d="M0 465L800 487M0 515L800 535M0 565L800 583"/><path d="M160 423L90 600M330 428L290 600M510 434L500 600M680 440L710 600"/></g>
