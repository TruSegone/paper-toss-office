<path d="M0 397L230 416L230 600H0Z" fill="#5d351f"/><path d="M0 386L230 407L230 432L0 410Z" fill="#7d481f"/><path d="M0 374L230 395L230 421L0 400Z" fill="url(#desk)" stroke="#6f3d1e" stroke-width="3"/><path d="M0 384L225 405M20 378L20 398M80 384L80 404M150 390L150 410" stroke="#f3bc76" stroke-opacity=".5" stroke-width="2"/>
<!-- small fan grounded on floor, visible contact shadow -->
<ellipse cx="355" cy="532" rx="55" ry="9" fill="#12222e" opacity=".38"/>
<g stroke="#2d5d72" stroke-width="3" stroke-linejoin="round">
 <path d="M347 500L347 526Q355 533 364 526L364 500Z" fill="url(#fanblue)"/>
 <ellipse cx="355" cy="493" rx="27" ry="8" fill="#168bb6" stroke="#d2e4eb" stroke-width="3"/>
 <circle cx="355" cy="455" r="37" fill="#197ca5" stroke="url(#metal)" stroke-width="5"/>
 <circle cx="355" cy="455" r="29" fill="#193f53" stroke="#a6d4e5" stroke-width="2"/>
 <g fill="url(#fanblue)" stroke="#79cde7" stroke-width="1"><path d="M355 455Q330 441 342 429Q354 428 359 449Z"/><path d="M355 455Q380 438 379 453Q373 464 360 460Z"/><path d="M355 455Q368 481 352 481Q344 473 351 460Z"/><path d="M355 455Q329 468 331 453Q338 444 350 450Z"/></g>
 <circle cx="355" cy="455" r="7" fill="#d4f5ff"/>
 <path d="M324 455Q355 420 386 455Q355 490 324 455Z" fill="none" stroke="#c4d9e2" stroke-width="2"/>
</g>
<!-- wastebasket firmly on floor, with contact shadow and clear opening -->
<ellipse cx="566" cy="558" rx="59" ry="11" fill="#12222e" opacity=".4"/>
<path d="M522 461L535 551Q566 565 597 551L610 461Z" fill="#334651" stroke="#aab8c0" stroke-width="3"/>
<path d="M526 472L538 547Q566 557 594 547L606 472Z" fill="url(#mesh)"/>
<ellipse cx="566" cy="461" rx="46" ry="13" fill="#1e2b34" stroke="#d8e0e4" stroke-width="5"/><ellipse cx="566" cy="461" rx="35" ry="7" fill="#101c25" stroke="#8597a2" stroke-width="2"/>
<!-- plant on window sill -->
<path d="M70 282L70 253M70 267L54 250M70 263L87 244" stroke="#467d42" stroke-width="4"/><g fill="#65a958" stroke="#386d39" stroke-width="1"><ellipse cx="54" cy="249" rx="9" ry="18" transform="rotate(-38 54 249)"/><ellipse cx="87" cy="244" rx="9" ry="19" transform="rotate(35 87 244)"/><ellipse cx="69" cy="240" rx="10" ry="20"/><ellipse cx="49" cy="265" rx="9" ry="16" transform="rotate(-60 49 265)"/></g><path d="M51 276L88 276L83 300Q69 307 56 300Z" fill="#a96632" stroke="#6e4226" stroke-width="2"/>
</svg>